name: Build TAYODE FOOTBALL APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check build environment
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== JAVA ====="
          java -version

          echo "===== GRADLE ====="
          gradle --version

          echo "===== REPOSITORY ====="
          pwd
          find . -maxdepth 3 -type f | sort

      - name: Check ZIP file
        shell: bash
        run: |
          set -euxo pipefail

          if [ ! -f "TAYODE_FOOTBALL_BUILD_01_47_FIXED.zip" ]; then
            echo "ERROR: TAYODE_FOOTBALL_BUILD_01_47_FIXED.zip was not found."
            exit 1
          fi

          ls -lh "TAYODE_FOOTBALL_BUILD_01_47_FIXED.zip"

      - name: Extract TAYODE FOOTBALL project
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf tayode_project
          mkdir -p tayode_project

          unzip -q TAYODE_FOOTBALL_BUILD_01_47_FIXED.zip -d tayode_project

          echo "===== EXTRACTED PROJECT ====="
          find tayode_project -maxdepth 6 -type f | sort

      - name: Find Android project
        shell: bash
        run: |
          set -euxo pipefail

          PROJECT_DIR=""

          while IFS= read -r file; do
            candidate="$(dirname "$file")"

            if [ -f "$candidate/settings.gradle" ] || \
               [ -f "$candidate/settings.gradle.kts" ]; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(find tayode_project -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) | sort)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project was not found."
            find tayode_project -maxdepth 6 -type f | sort
            exit 1
          fi

          echo "Android project detected at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Inspect Gradle project
        shell: bash
        run: |
          set -euxo pipefail

          cd "$PROJECT_DIR"

          echo "===== PROJECT DIRECTORY ====="
          pwd

          echo "===== PROJECT FILES ====="
          find . -maxdepth 4 -type f | sort

          echo "===== GRADLE WRAPPER ====="
          if [ -f "./gradlew" ]; then
            echo "gradlew FOUND"
            ls -lh ./gradlew
          else
            echo "gradlew NOT FOUND"
          fi

          if [ -f "./gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "gradle-wrapper.properties FOUND"
            cat ./gradle/wrapper/gradle-wrapper.properties
          else
            echo "gradle-wrapper.properties NOT FOUND"
          fi

      - name: Build TAYODE FOOTBALL APK
        shell: bash
        run: |
          set -euxo pipefail

          cd "$PROJECT_DIR"

          echo "===== BUILD START ====="
          echo "Building project from:"
          pwd

          if [ -f "./gradlew" ]; then
            echo "Gradle Wrapper found. Using ./gradlew"
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace --info
          else
            echo "Gradle Wrapper not found."
            echo "Using installed Gradle 8.9"
            gradle assembleDebug --stacktrace --info
          fi

      - name: Find generated APK
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== GENERATED APK SEARCH ====="

          find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TAYODE-FOOTBALL-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
