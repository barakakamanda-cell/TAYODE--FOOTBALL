name: Build TAYODE FOOTBALL APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check ZIP file
        shell: bash
        run: |
          set -e
          echo "Files in repository:"
          ls -la

          if [ ! -f "TAYODE_FOOTBALL_BUILD_01_47_FIXED.zip" ]; then
            echo "ERROR: TAYODE_FOOTBALL_BUILD_01_47.zip was not found."
            exit 1
          fi

          echo "ZIP file found successfully."

      - name: Extract TAYODE FOOTBALL project
        shell: bash
        run: |
          set -e

          rm -rf tayode_project
          mkdir -p tayode_project

          unzip -q TAYODE_FOOTBALL_BUILD_01_47_FIXED.zip -d tayode_project

          echo "Extracted project structure:"
          find tayode_project -maxdepth 4 -type f | sort

      - name: Find Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find tayode_project -type f -name "settings.gradle*" -o -type f -name "build.gradle*" | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project was not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_DIR")

          echo "Android project detected at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build TAYODE FOOTBALL APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Building project from:"
          pwd

          if [ -f "./gradlew" ]; then
            echo "Gradle Wrapper found. Using ./gradlew"
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "Gradle Wrapper not found."
            echo "Using installed Gradle 8.9"
            gradle assembleDebug --stacktrace
          fi

      - name: Find generated APK
        shell: bash
        run: |
          set -e

          echo "Searching for generated APK..."

          find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TAYODE-FOOTBALL-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
